services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: verifact
      POSTGRES_USER: verifact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - verifact_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifact -d verifact"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  verifact_pg:
